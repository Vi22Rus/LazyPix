name: LazyPix Windows DEV
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained single EXE
        shell: pwsh
        run: dotnet publish .\LazyPix.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false
      - uses: actions/upload-artifact@v4
        with:
          name: LazyPix-Windows-DEV
          path: bin/Release/net10.0-windows/win-x64/publish/
          if-no-files-found: error
